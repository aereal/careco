---
name: CI
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
jobs:
  ok:
    needs:
      - build-client
    if: failure()
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
  build-client:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      AQUA_CONFIG: ${{ github.workspace }}/aqua.yaml
      AQUA_POLICY_CONFIG: ${{ github.workspace }}/aqua-policy.yaml
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: aquaproj/aqua-installer@11dd79b4e498d471a9385aa9fb7f62bb5f52a73c # v4.0.4
        with:
          aqua_version: v2.55.1
      - continue-on-error: true
        run: |
          pnpm lint > out.txt
      - id: lint
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f eslint -fail-level any -filter-mode nofilter -reporter github-pr-review < out.txt
      - id: test
        continue-on-error: true
        env:
          TZ: Asia/Tokyo
        run: pnpm test
      - uses: k1LoW/octocov-action@73d561f65d59e66899ed5c87e4621a913b5d5c20 # v1.5.0
        if: ${{ steps.test.outcome != 'failure' }}
        with:
          version: v0.73.0
          config: octocov.frontend.yml
      - id: build
        run: pnpm build
        continue-on-error: true
      - if: ${{ steps.lint.outcome == 'failure' || steps.build.outcome == 'failure' || steps.test.outcome == 'failure' }}
        run: exit 1
  test-server:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    services:
      firestore:
        image: 'ghcr.io/aereal/firebase-emulator-image:v0.1.0'
        ports:
          - 8888
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        id: setup-go
        with:
          cache: true
          go-version-file: go.mod
      - run: go mod download
      - name: setup env
        run: |
          echo "FIRESTORE_EMULATOR_ADDR=localhost:${firestore_emulator_port}" >> "$GITHUB_ENV"
        env:
          firestore_emulator_port: ${{ job.services.firestore.ports['8888'] }}
      - name: go test
        run: go test -coverpkg=./... -coverprofile=./coverage.out -timeout=30s ./backend/...
      - uses: k1LoW/octocov-action@73d561f65d59e66899ed5c87e4621a913b5d5c20 # v1.5.0
        with:
          version: v0.73.0
          config: octocov.backend.yml
