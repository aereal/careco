---
name: CI
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
env:
  AQUA_CONFIG: ${{ github.workspace }}/aqua.yaml
  AQUA_POLICY_CONFIG: ${{ github.workspace }}/aqua-policy.yaml
jobs:
  ok:
    needs:
      - frontend-test
      - frontend-e2e-test
      - frontend-lint
      - frontend-check-diff
      - backend-test
    if: failure()
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1
  frontend-test:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm test
      - uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1
        with:
          version: v0.75.10
          config: octocov.frontend.yml
  frontend-lint:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.60.1
      - continue-on-error: true
        run: pnpm lint > out.txt
      - env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f eslint -fail-level any -filter-mode nofilter -reporter github-pr-review < out.txt
  frontend-e2e-test:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      TZ: Asia/Tokyo
      VITE_AUTH0_DOMAIN: careco.auth0.test
      VITE_AUTH0_CLIENT_ID: dummy-client
      VITE_AUTH0_AUDIENCE: http://careco.test/app
      VITE_AUTH0_ISSUER: https://careco.auth0.test/
      VITE_BACKEND_ENDPOINT: http://localhost:8080/graphql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: generate AUTH0_SECRET
        run: |
          echo "AUTH0_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - id: test
        continue-on-error: true
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - run: exit 1
        if: ${{ steps.test.outcome == 'failure' }}
  frontend-check-diff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm codegen
      - run: node ./tools/check-diff.js
  frontend-deploy-preview:
    uses: ./.github/workflows/deploy-vercel.yml
    needs:
      - frontend-check-diff
      - frontend-e2e-test
      - frontend-lint
      - frontend-test
    secrets: inherit
    with:
      environment: preview
  frontend-deploy-production:
    uses: ./.github/workflows/deploy-vercel.yml
    needs:
      - frontend-check-diff
      - frontend-e2e-test
      - frontend-lint
      - frontend-test
    secrets: inherit
    with:
      environment: production
  backend-test:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    services:
      firestore:
        image: 'ghcr.io/aereal/firebase-emulator-image:v0.1.0'
        ports:
          - 8888
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          cache: true
          go-version-file: go.mod
      - run: go mod download
      - name: setup env
        run: |
          echo "FIRESTORE_EMULATOR_ADDR=localhost:${firestore_emulator_port}" >> "$GITHUB_ENV"
        env:
          firestore_emulator_port: ${{ job.services.firestore.ports['8888'] }}
      - name: go test
        run: go test -coverpkg=./... -coverprofile=./coverage.out -timeout=30s ./backend/...
      - uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1.5.1
        with:
          version: v0.75.10
          config: octocov.backend.yml
  backend-build:
    runs-on: ubuntu-24.04
    needs:
      - backend-test
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: asia-northeast1-docker.pkg.dev
      KOCACHE: ${{ github.workspace }}/.ko-cache
    outputs:
      image: ${{ steps.build.outputs.image }}
      revision: ${{ steps.build.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.18.1
      - id: auth
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_POOL_ID }}/providers/${{ secrets.GCP_PROVIDER_ID }}'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db' # v3.0.1
        with:
          version: '573.0.0'
      - name: configure docker authz
        run: gcloud auth configure-docker "$REGISTRY"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          cache: true
          go-version-file: go.mod
      - run: go mod download
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KOCACHE }}
          key: ${{ runner.os }}-ko-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-ko-
      - id: build
        name: build
        run: |
          image="$(ko build --bare --platform linux/amd64 --tags "$image_tag" ./backend/cmd/server)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "revision=${image_tag}" >> "$GITHUB_OUTPUT"
        env:
          image_tag: ${{ github.sha }}
          KO_DOCKER_REPO: ${{ env.REGISTRY }}/${{ steps.auth.outputs.project_id }}/backend/backend
  backend-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    needs:
      - backend-build
    environment:
      name: production-backend
    concurrency:
      group: ${{ github.job }}-${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0
        with:
          create_credentials_file: true
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.GCP_POOL_ID }}/providers/${{ secrets.GCP_PROVIDER_ID }}'
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db' # v3.0.1
        with:
          version: '573.0.0'
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: production-backend
          image: ${{ needs.backend-build.outputs.image }}
          region: asia-northeast1
          env_vars: |-
            AUTH0_AUDIENCE=https://aereal.org/#careco-dev
            AUTH0_ISSUER=https://careco-dev.jp.auth0.com/
            GOOGLE_CLOUD_PROJECT=${{ steps.auth.outputs.project_id }}
            OTEL_SERVICE_VERSION=${{ needs.backend-build.outputs.revision }}
            FIRESTORE_DATABASE_ID=driving-records
          secrets: |
            ALLOWED_SUBJECTS=allowed_subjects:latest
          flags: |
            --service-account cloud-run-runner@careco-477008.iam.gserviceaccount.com
          labels: |-
            github-head-ref=${{ github.head_ref }}
            github-job=${{ github.job }}
            github-run-id=${{ github.run_id }}
            github-run-number=${{ github.run_number }}
            github-run-attempt=${{ github.run_attempt }}
            github-sha=${{ github.sha }}
