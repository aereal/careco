---
name: deploy to Vercel
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: frontend-${{ inputs.environment }}
    concurrency:
      group: deploy-frontend-${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: pull environment
        run: pnpm exec vercel pull --yes --environment "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.environment }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
      - name: build
        run: pnpm exec vercel build --yes --target "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.environment }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
          VITE_BACKEND_ENDPOINT: ${{ secrets.VITE_BACKEND_ENDPOINT }}
      - name: deploy
        id: deploy
        run: |
          pnpm exec vercel deploy --yes --prebuilt --target "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.environment }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
