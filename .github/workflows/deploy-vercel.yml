---
name: deploy to Vercel
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: frontend-${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-frontend-${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: pull environment
        run: pnpm exec vercel pull --yes --environment "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.environment }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
      - name: build
        run: pnpm exec vercel build --yes --target "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.environment }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
          VITE_BACKEND_ENDPOINT: ${{ secrets.VITE_BACKEND_ENDPOINT }}
      - name: deploy
        id: deploy
        run: |
          pnpm exec vercel deploy --yes --prebuilt --target "$_env" --token "$_vercel_token" 1>out.txt
          echo "url=$(cat out.txt)" >> "$GITHUB_OUTPUT"
        env:
          _env: ${{ inputs.environment }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
