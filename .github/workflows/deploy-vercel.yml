---
name: deploy to Vercel
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: frontend-${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-frontend-${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: pull environment
        run: pnpm exec vercel pull --yes --environment "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.env }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
      - name: build
        run: pnpm exec vercel build --yes --target "$_env" --token "$_vercel_token"
        env:
          _env: ${{ inputs.env }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
          VITE_BACKEND_ENDPOINT: ${{ secrets.VITE_BACKEND_ENDPOINT }}
      - name: deploy
        id: deploy
        run: |
          pnpm exec vercel deploy --yes --prebuilt --target "$_env" --token "$_vercel_token" 1>out.txt
          echo "url=$(cat out.txt)" >> "$GITHUB_OUTPUT"
        env:
          _env: ${{ inputs.env }}
          _vercel_token: ${{ secrets.VERCEL_TOKEN }}
