services:
  jaeger:
    image: 'cr.jaegertracing.io/jaegertracing/jaeger:2.20.0'
    ports:
      - '4317'
      - '16686:16686'
  otelc:
    image: 'ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.156.0'
    ports:
      - '4317:4317'
    volumes:
      - './etc/otelc.yml:/etc/otelcol-contrib/config.yaml'
    environment:
      JAEGER_HOST: 'jaeger:4317'
  firestore:
    image: 'ghcr.io/aereal/firebase-emulator-image:v0.1.0'
    ports:
      - '8888:8888'
    volumes:
      - './data/firestore:/data'
