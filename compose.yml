services:
  jaeger:
    image: 'cr.jaegertracing.io/jaegertracing/jaeger:2.10.0'
    ports:
      - '4317'
      - '16686:16686'
  otelc:
    image: 'ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.136.0'
    ports:
      - '4317:4317'
    volumes:
      - './etc/otelc.yml:/etc/otelcol-contrib/config.yaml'
    environment:
      JAEGER_HOST: 'jaeger:4317'
  firestore:
    image: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:547.0.0-emulators'
    ports:
      - '8888:8888'
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port
      - '0.0.0.0:8888'
      - --export-on-exit
      - /data
    volumes:
      - './data/firestore:/data'
  test_firestore:
    image: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:547.0.0-emulators'
    ports:
      - '8889:8888'
    command:
      - gcloud
      - emulators
      - firestore
      - start
      - --host-port
      - '0.0.0.0:8888'
