# yaml-language-server: $schema=./tests.schema.json
---
cases:
  'query lastReport/empty':
    request:
      query: |
        {
          lastReport {
            odometerValue
          }
        }
    response:
      data:
        lastReport: null
  'query lastReport/ok':
    request:
      query: |
        {
          lastReport {
            odometerValue
            tire {
              id
            }
          }
        }
    response:
      data:
        lastReport:
          odometerValue: 45678
          tire: null
  'query recentDrivingRecords/ok':
    request:
      query: |
        query GetLatest($first: Int!) {
          recentDrivingRecords(first: $first) {
            nodes {
              recordedAt
              memo
              odometerValue
            }
          }
        }
      variables:
        first: 4
    response:
      data:
        recentDrivingRecords:
          nodes:
            - odometerValue: 10004
              recordedAt: '2025-10-03T12:34:56+00:00'
              memo: null
            - odometerValue: 10003
              recordedAt: '2025-10-02T12:34:56+00:00'
              memo: blah blah
            - odometerValue: 10002
              recordedAt: '2025-10-01T12:34:56+00:00'
              memo: null
            - odometerValue: 10001
              recordedAt: '2025-09-30T12:34:56+00:00'
              memo: blah blah
  'query monthlyReport/ok':
    request:
      query: |
        query GetMonthly($year: Int!, $month: Month!) {
          monthlyReport(year: $year, month: $month) {
            year
            month
            odometerValue
            dailyReports {
              nodes {
                year
                month
                day
                odometerValue
              }
            }
          }
        }
      variables:
        year: 2025
        month: OCTOBER
    response:
      data:
        monthlyReport:
          year: 2025
          month: OCTOBER
          odometerValue: 10003
          dailyReports:
            nodes:
              -
                odometerValue: 10003
                year: 2025
                month: OCTOBER
                day: 3
              -
                odometerValue: 10002
                year: 2025
                month: OCTOBER
                day: 2
              -
                odometerValue: 10001
                year: 2025
                month: OCTOBER
                day: 1
  'query yearlyReport/ok':
    request:
      query: |
        query GetYearly($year: Int!) {
          yearlyReport(year: $year) {
            year
            odometerValue
            monthlyReports {
              year
              month
              odometerValue
              dailyReports {
                nodes {
                  year
                  month
                  day
                  odometerValue
                }
              }
            }
          }
        }
      variables:
        year: 2025
    response:
      data:
        yearlyReport:
          year: 2025
          odometerValue: 10007
          monthlyReports:
            - month: OCTOBER
              year: 2025
              odometerValue: 10007
              dailyReports:
                nodes:
                  -
                    odometerValue: 10007
                    year: 2025
                    month: OCTOBER
                    day: 3
                  -
                    odometerValue: 10006
                    year: 2025
                    month: OCTOBER
                    day: 2
                  -
                    odometerValue: 10005
                    year: 2025
                    month: OCTOBER
                    day: 1
            - month: SEPTEMBER
              year: 2025
              odometerValue: 10004
              dailyReports:
                nodes:
                  -
                    odometerValue: 10004
                    year: 2025
                    month: SEPTEMBER
                    day: 30
                  -
                    odometerValue: 10003
                    year: 2025
                    month: SEPTEMBER
                    day: 29
                  -
                    odometerValue: 10002
                    year: 2025
                    month: SEPTEMBER
                    day: 28
  'mutation recordDrivingRecord/ok':
    request:
      query: |
        mutation Record($date: DateTime!, $distance: Int!, $memo: String, $tireID: ID!) {
          recordDrivingRecord(date: $date, odometerValue: $distance, memo: $memo, tireID: $tireID)
        }
      variables:
        date: '2025-10-03T00:00:00+00:00'
        distance: 10001
        tireID: tire-1
    response:
      data:
        recordDrivingRecord: true
  'mutation recordDrivingRecord/tire not found':
    request:
      query: |
        mutation Record($date: DateTime!, $distance: Int!, $tireID: ID!) {
          recordDrivingRecord(date: $date, odometerValue: $distance, tireID: $tireID)
        }
      variables:
        date: '2025-10-03T00:00:00+00:00'
        distance: 10001
        tireID: not-exist
    response:
      errors:
        - message: Tire not found
          path:
            - recordDrivingRecord
          locations:
            - line: 2
              column: 3
      data: null
  'mutation recordDrivingRecord/retired tire':
    request:
      query: |
        mutation Record($date: DateTime!, $distance: Int!, $tireID: ID!) {
          recordDrivingRecord(date: $date, odometerValue: $distance, tireID: $tireID)
        }
      variables:
        date: '2025-10-03T00:00:00+00:00'
        distance: 10001
        tireID: tire-retired
    response:
      errors:
        - message: Tire is retired
          path:
            - recordDrivingRecord
          locations:
            - line: 2
              column: 3
      data: null
  'mutation addTire/ok':
    request:
      query: |
        mutation AddTire($name: String!, $purchasedOn: DateTime) {
          addTire(name: $name, purchasedOn: $purchasedOn) {
            id
            name
            purchasedOn
            retired
          }
        }
      variables:
        name: summer
        purchasedOn: '2025-04-01T00:00:00+00:00'
    response:
      data:
        addTire:
          id: tire-1
          name: summer
          purchasedOn: '2025-04-01T00:00:00+00:00'
          retired: false
  'mutation retireTire/ok':
    request:
      query: |
        mutation RetireTire($id: ID!) {
          retireTire(id: $id) {
            id
            name
            purchasedOn
            retired
          }
        }
      variables:
        id: tire-1
    response:
      data:
        retireTire:
          id: tire-1
          name: summer
          purchasedOn: null
          retired: true
  'mutation retireTire/not found':
    request:
      query: |
        mutation RetireTire($id: ID!) {
          retireTire(id: $id) {
            id
          }
        }
      variables:
        id: not-exist
    response:
      errors:
        - message: Tire not found
          path:
            - retireTire
          locations:
            - line: 2
              column: 3
      data: null
  'query tires/ok':
    request:
      query: |
        {
          tires {
            id
            name
            purchasedOn
            retired
          }
        }
    response:
      data:
        tires:
          - id: tire-1
            name: studless
            purchasedOn: '2024-11-01T00:00:00+00:00'
            retired: false
          - id: tire-2
            name: summer
            purchasedOn: null
            retired: false
  'query tires/includeRetired':
    request:
      query: |
        {
          tires(includeRetired: true) {
            id
            retired
          }
        }
    response:
      data:
        tires:
          - id: tire-1
            retired: false
          - id: tire-3
            retired: true
  'query lastReport/with tire':
    request:
      query: |
        {
          lastReport {
            odometerValue
            tire {
              id
              name
            }
          }
        }
    response:
      data:
        lastReport:
          odometerValue: 45678
          tire:
            id: tire-1
            name: summer
  'query tripDistance':
    request:
      query: |
        query TripDistance($year: Int!) {
          yearlyReport(year: $year) {
            year
            monthlyReports {
              year
              month
              tripDistance
              dailyReports {
                nodes {
                  year
                  month
                  day
                  tripDistance
                }
              }
            }
          }
        }
      variables:
        year: 2025
    response:
      data:
        yearlyReport:
          year: 2025
          monthlyReports:
            - month: OCTOBER
              year: 2025
              tripDistance: 10
              dailyReports:
                nodes:
                  -
                    tripDistance: 5
                    year: 2025
                    month: OCTOBER
                    day: 3
                  -
                    tripDistance: 3
                    year: 2025
                    month: OCTOBER
                    day: 2
                  -
                    tripDistance: 2
                    year: 2025
                    month: OCTOBER
                    day: 1
            - month: SEPTEMBER
              year: 2025
              tripDistance: 10004
              dailyReports:
                nodes:
                  -
                    tripDistance: 1
                    year: 2025
                    month: SEPTEMBER
                    day: 30
                  -
                    tripDistance: 1
                    year: 2025
                    month: SEPTEMBER
                    day: 29
                  -
                    tripDistance: 1
                    year: 2025
                    month: SEPTEMBER
                    day: 28
