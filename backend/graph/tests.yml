# yaml-language-server: $schema=./tests.schema.json
---
cases:
  'query totalStatistics/ok':
    request:
      query: |
        {
          totalStatistics {
            odometerValue
          }
        }
    response:
      data:
        totalStatistics:
          odometerValue: 45678
  'query recentDrivingRecords/ok':
    request:
      query: |
        query GetLatest($first: Int!) {
          recentDrivingRecords(first: $first) {
            nodes {
              recordedAt
              memo
              odometerValue
            }
          }
        }
      variables:
        first: 4
    response:
      data:
        recentDrivingRecords:
          nodes:
            - odometerValue: 0
              recordedAt: '2025-10-03T12:34:56+00:00'
              memo: null
            - odometerValue: 12
              recordedAt: '2025-10-02T12:34:56+00:00'
              memo: blah blah
            - odometerValue: 24
              recordedAt: '2025-10-01T12:34:56+00:00'
              memo: null
            - odometerValue: 36
              recordedAt: '2025-09-30T12:34:56+00:00'
              memo: blah blah
  'query monthlyReport/ok':
    request:
      query: |
        query GetMonthly($year: Int!, $month: Month!) {
          monthlyReport(year: $year, month: $month) {
            year
            month
            odometerValue
            dailyReports {
              nodes {
                year
                month
                day
                odometerValue
              }
            }
          }
        }
      variables:
        year: 2025
        month: OCTOBER
    response:
      data:
        monthlyReport:
          year: 2025
          month: OCTOBER
          odometerValue: 36
          dailyReports:
            nodes:
              -
                odometerValue: 0
                year: 2025
                month: OCTOBER
                day: 3
              -
                odometerValue: 12
                year: 2025
                month: OCTOBER
                day: 2
              -
                odometerValue: 24
                year: 2025
                month: OCTOBER
                day: 1
  'query yearlyReport/ok':
    request:
      query: |
        query GetYearly($year: Int!) {
          yearlyReport(year: $year) {
            year
            odometerValue
            monthlyReports {
              year
              month
              odometerValue
              dailyReports {
                nodes {
                  year
                  month
                  day
                  odometerValue
                }
              }
            }
          }
        }
      variables:
        year: 2025
    response:
      data:
        yearlyReport:
          year: 2025
          odometerValue: 72
          monthlyReports:
            - month: OCTOBER
              year: 2025
              odometerValue: 36
              dailyReports:
                nodes:
                  -
                    odometerValue: 0
                    year: 2025
                    month: OCTOBER
                    day: 3
                  -
                    odometerValue: 12
                    year: 2025
                    month: OCTOBER
                    day: 2
                  -
                    odometerValue: 24
                    year: 2025
                    month: OCTOBER
                    day: 1
            - month: SEPTEMBER
              year: 2025
              odometerValue: 36
              dailyReports:
                nodes:
                  -
                    odometerValue: 0
                    year: 2025
                    month: SEPTEMBER
                    day: 30
                  -
                    odometerValue: 12
                    year: 2025
                    month: SEPTEMBER
                    day: 29
                  -
                    odometerValue: 24
                    year: 2025
                    month: SEPTEMBER
                    day: 28
  'mutation recordDrivingRecord/ok':
    request:
      query: |
        mutation Record($date: DateTime!, $distance: Int!, $memo: String) {
          recordDrivingRecord(date: $date, odometerValue: $distance, memo: $memo)
        }
      variables:
        date: '2025-10-03T00:00:00+00:00'
        distance: 12
    response:
      data:
        recordDrivingRecord: true
